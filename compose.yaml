services:
  web:
    build: .
    ports:
      - "8101:80" # Acesso no navegador: porta 8101. O Docker direciona para a 80 do Apache.
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

  python_app:
    image: python:3.12-slim
    profiles:
      - tools
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    env_file:
      - .env
    command: >
      sh -c "pip install -r requirements.txt && python autoinsert.py"

  db:
    image: mysql:8.0
    ports:
      - "3101:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
