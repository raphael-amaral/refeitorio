name: ${COMPOSE_PROJECT_NAME:-refeitorio}

services:
  web:
    build: .
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - .:/var/www/html
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR não definido}/questor
        target: ${BACKUP_DIR:?BACKUP_DIR não definido}/questor
    env_file:
      - .env
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: unless-stopped
